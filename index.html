<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count on Me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #e8f0ff, #fff3e8);
      font-family: Arial, sans-serif;
      color: #303747;
    }

    .carte {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 30px;
      font-weight: 700;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    p {
      font-size: 15px;
      color: #737b8c;
      margin-bottom: 18px;
    }

    audio {
      width: 100%;
    }

    .signature {
      margin-top: 24px;
      font-size: 12px;
      color: #9ba1ad;
    }
  </style>
</head>

<body>
  <main class="carte">
    <h1>Count on Me</h1>

    <img
      class="photo"
      src="photo.jpg"
      alt="Photo souvenir"
    >

    <p>Joyeux anniversaire ❤️</p>

    <audio controls preload="none">
      <source
        src="musique.mp3"
        type="audio/mpeg"
      >
      
    </audio>

    <div class="signature">
      by Livia
    </div>
  </main>
</body>
</html>
